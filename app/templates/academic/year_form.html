{# New academic year. #}
{% extends "partials/stitch_base.html" %}
{% block title %}سنة دراسية جديدة{% endblock %}
{% block topbar_crumb %}
  <span class="material-symbols-outlined text-sm text-outline">chevron_left</span>
  <a href="{{ url_for('academic.years_list') }}" class="hover:text-primary">السنوات</a>
{% endblock %}

{% block page_content %}
<div class="max-w-2xl mx-auto flex flex-col gap-space-md">
  <h1 class="font-headline-lg text-headline-lg text-primary">إضافة سنة دراسية</h1>
  <form method="post" class="bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm flex flex-col gap-space-md">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="flex flex-col gap-1.5">
      <label class="font-label-md text-label-md text-on-surface font-bold">اسم السنة <span class="text-error">*</span></label>
      <input name="name" required placeholder="مثال: 2025-2026" dir="ltr"
             class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20">
    </div>
    <div class="grid grid-cols-2 gap-space-md">
      <div class="flex flex-col gap-1.5">
        <label class="font-label-md text-label-md text-on-surface font-bold">تاريخ البداية <span class="text-error">*</span></label>
        <input name="start_date" type="date" required
               class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20">
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="font-label-md text-label-md text-on-surface font-bold">تاريخ النهاية <span class="text-error">*</span></label>
        <input name="end_date" type="date" required
               class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20">
      </div>
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="font-label-md text-label-md text-on-surface font-bold">الحالة</label>
      <select name="status" class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20">
        <option value="active">نشطة</option>
        <option value="closed">مغلقة</option>
      </select>
    </div>
    <div class="flex justify-end">
      <button type="submit" class="h-11 px-6 rounded-xl text-on-primary font-title-md font-bold flex items-center gap-2 shadow-md"
              style="background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 55%, #0099CC 100%);">
        <span class="material-symbols-outlined">save</span><span>حفظ السنة</span>
      </button>
    </div>
  </form>
</div>
{% endblock %}
