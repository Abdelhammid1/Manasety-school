{# Shared shell for report pages — header + date filter form + body slot. #}
{% macro filter_form(endpoint, start=None, end=None, at=None) %}
<form method="get" action="{{ url_for(endpoint) }}" class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex items-end gap-space-md flex-wrap">
  {% if at is not none %}
  <div class="flex flex-col gap-1">
    <label class="font-label-md font-bold">التاريخ</label>
    <input name="at" type="date" value="{{ at }}" class="h-11 px-3 rounded-lg bg-surface-container-low">
  </div>
  {% else %}
  <div class="flex flex-col gap-1">
    <label class="font-label-md font-bold">من</label>
    <input name="start" type="date" value="{{ start }}" class="h-11 px-3 rounded-lg bg-surface-container-low">
  </div>
  <div class="flex flex-col gap-1">
    <label class="font-label-md font-bold">إلى</label>
    <input name="end" type="date" value="{{ end }}" class="h-11 px-3 rounded-lg bg-surface-container-low">
  </div>
  {% endif %}
  {{ caller() if caller is defined else "" }}
  <button type="submit" class="h-11 px-5 rounded-xl text-on-primary font-title-md font-bold flex items-center gap-2"
          style="background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 55%, #0099CC 100%);">
    <span class="material-symbols-outlined">refresh</span>تحديث
  </button>
</form>
{% endmacro %}
