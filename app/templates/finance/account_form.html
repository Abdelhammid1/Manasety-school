{# New account form. #}
{% extends "partials/stitch_base.html" %}
{% block title %}حساب جديد{% endblock %}
{% block topbar_crumb %}
  <span class="material-symbols-outlined text-sm text-outline">chevron_left</span>
  <a href="{{ url_for('finance.accounts') }}" class="hover:text-primary">دليل الحسابات</a>
{% endblock %}

{% block page_content %}
<div class="max-w-2xl mx-auto flex flex-col gap-space-md">
  <h1 class="font-headline-lg text-headline-lg text-primary">إضافة حساب جديد</h1>
  <form method="post" class="bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm flex flex-col gap-space-md">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-space-md">
      <div class="flex flex-col gap-1.5">
        <label class="font-label-md text-label-md text-on-surface font-bold">الرمز <span class="text-error">*</span></label>
        <input name="code" required dir="ltr" placeholder="1101"
               class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20 font-mono">
      </div>
      <div class="md:col-span-2 flex flex-col gap-1.5">
        <label class="font-label-md text-label-md text-on-surface font-bold">اسم الحساب <span class="text-error">*</span></label>
        <input name="name" required
               class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20">
      </div>
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="font-label-md text-label-md text-on-surface font-bold">النوع <span class="text-error">*</span></label>
      <select name="type" required class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20">
        <option value="asset">أصول</option>
        <option value="liability">خصوم</option>
        <option value="equity">حقوق ملكية</option>
        <option value="revenue">إيرادات</option>
        <option value="expense">مصروفات</option>
      </select>
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="font-label-md text-label-md text-on-surface font-bold">الحساب الأب (اختياري)</label>
      <select name="parent_id" class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20">
        <option value="">— لا يوجد —</option>
        {% for a in parents %}<option value="{{ a.id }}"><code>{{ a.code }}</code> — {{ a.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="flex justify-end">
      <button type="submit" class="h-11 px-6 rounded-xl text-on-primary font-title-md font-bold flex items-center gap-2 shadow-md"
              style="background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 55%, #0099CC 100%);">
        <span class="material-symbols-outlined">save</span><span>إضافة الحساب</span>
      </button>
    </div>
  </form>
</div>
{% endblock %}
