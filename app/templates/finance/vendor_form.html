{# New vendor form. #}
{% extends "partials/stitch_base.html" %}
{% block title %}مورد جديد{% endblock %}
{% block topbar_crumb %}
  <span class="material-symbols-outlined text-sm text-outline">chevron_left</span>
  <a href="{{ url_for('finance.vendors_list') }}" class="hover:text-primary">الموردون</a>
{% endblock %}

{% block page_content %}
<div class="max-w-2xl mx-auto flex flex-col gap-space-md">
  <h1 class="font-headline-lg text-headline-lg text-primary">إضافة مورد جديد</h1>
  <form method="post" class="bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm flex flex-col gap-space-md">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="flex flex-col gap-1.5">
      <label class="font-label-md text-label-md text-on-surface font-bold">اسم المورد <span class="text-error">*</span></label>
      <input name="name" required class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20">
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
      <div class="flex flex-col gap-1.5">
        <label class="font-label-md text-label-md text-on-surface font-bold">الهاتف</label>
        <input name="phone" dir="ltr" class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20">
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="font-label-md text-label-md text-on-surface font-bold">البريد الإلكتروني</label>
        <input name="email" type="email" dir="ltr" class="h-12 px-4 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20">
      </div>
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="font-label-md text-label-md text-on-surface font-bold">العنوان</label>
      <textarea name="address" rows="2" class="w-full px-4 py-2 rounded-xl bg-surface-container-low focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20"></textarea>
    </div>
    <div class="flex justify-end">
      <button type="submit" class="h-11 px-6 rounded-xl text-on-primary font-title-md font-bold flex items-center gap-2 shadow-md"
              style="background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 55%, #0099CC 100%);">
        <span class="material-symbols-outlined">save</span><span>حفظ المورد</span>
      </button>
    </div>
  </form>
</div>
{% endblock %}
