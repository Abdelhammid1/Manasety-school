{# Ticket S7 — Printable ID card for a student. #}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بطاقة طالب — {{ student.full_name }}</title>
<style>
  @page { size: 85.6mm 54mm; margin: 0; }
  body { margin: 0; font-family: 'Cairo', sans-serif; }
  .card {
    width: 85.6mm; height: 54mm;
    box-sizing: border-box; padding: 4mm;
    background: linear-gradient(135deg, #0C2461 0%, #1E3A8A 55%, #2563EB 100%);
    color: white; position: relative; overflow: hidden;
  }
  .brand { font-size: 8pt; opacity: 0.85; }
  .name { font-size: 14pt; font-weight: 800; margin-top: 4mm; }
  .code { font-size: 9pt; letter-spacing: 1px; margin-top: 2mm; direction: ltr; }
  .qr { position: absolute; right: 4mm; bottom: 4mm; background: white; padding: 2mm; border-radius: 4px; }
  .qr svg { width: 15mm; height: 15mm; }
  .photo { position: absolute; left: 4mm; bottom: 4mm; width: 18mm; height: 22mm; border-radius: 4px; overflow: hidden; background: rgba(255,255,255,0.15); display: flex; align-items:center; justify-content:center; font-size:16pt; font-weight:800; }
  .fallback-qr { font-family: monospace; font-size: 6pt; background: white; color: #0C2461; padding: 2mm; border-radius: 4px; }
  .print-btn { padding: 12px 20px; background: #1E3A8A; color: white; border: 0; border-radius: 8px; margin: 20px; cursor: pointer; }
  @media print {
    .print-btn { display: none; }
  }
</style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">طباعة</button>
  <div class="card">
    <div class="brand">مدرسة منصتي</div>
    <div class="name">{{ student.full_name }}</div>
    <div class="code">{{ student.permanent_code }}</div>
    <div class="photo">
      {% if student.photo_url %}
      <img src="{{ student.photo_url }}" alt="" style="width:100%; height:100%; object-fit:cover;">
      {% else %}
      {{ student.full_name[:1] }}
      {% endif %}
    </div>
    <div class="qr">
      {{ qr_svg|safe }}
    </div>
  </div>
</body>
</html>
