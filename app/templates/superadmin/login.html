{% extends "superadmin/base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>دخول لوحة المنصة</h1>
  <p class="sub">لفريق منصتي فقط. لكل دخول خطوة تحقق إضافية.</p>
  <form method="post" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">البريد الإلكتروني</label>
    <input id="email" name="email" type="email" dir="ltr" required autofocus autocomplete="username">
    <label for="password">كلمة المرور</label>
    <input id="password" name="password" type="password" dir="ltr" required autocomplete="current-password">
    <button class="btn block" type="submit">متابعة</button>
  </form>
</div>
{% endblock %}
