{% extends "superadmin/base.html" %}
{% block title %}تغيير كلمة المرور{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>تغيير كلمة المرور</h1>
  {% if forced %}<p class="sub">لازم تختار كلمة مرور جديدة قبل ما تكمّل.</p>{% else %}<p class="sub">12 حرفًا على الأقل.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="current_password">كلمة المرور الحالية</label>
    <input id="current_password" name="current_password" type="password" dir="ltr" required autocomplete="current-password">
    <label for="new_password">كلمة المرور الجديدة</label>
    <input id="new_password" name="new_password" type="password" dir="ltr" required minlength="12" autocomplete="new-password">
    <label for="confirm_password">تأكيد كلمة المرور</label>
    <input id="confirm_password" name="confirm_password" type="password" dir="ltr" required minlength="12" autocomplete="new-password">
    <label for="code">رمز التحقق</label>
    <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" dir="ltr" required autocomplete="one-time-code">
    <button class="btn block" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
