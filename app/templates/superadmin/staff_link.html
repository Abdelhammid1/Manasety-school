{% extends "superadmin/base.html" %}
{% block title %}رابط ضبط الباسورد{% endblock %}
{% block content %}
<p><a href="{{ url_for('superadmin.school_staff', school_id=school.id) }}">→ موظفو {{ school.name }}</a></p>
<h1>رابط ضبط الباسورد</h1>
<p class="sub">لـ{{ user.full_name }} — صالح 72 ساعة ولمرة واحدة، ومش هيظهر تاني. الروابط القديمة اتلغت.</p>
<div class="card">
  <div style="display:flex;gap:8px"><input id="link" class="mono" readonly value="{{ link }}" aria-label="رابط ضبط الباسورد" style="flex:1">
    <button class="btn" type="button" onclick="var i=document.getElementById('link');i.select();navigator.clipboard&&navigator.clipboard.writeText(i.value);this.textContent='تم النسخ'">نسخ</button></div>
</div>
{% endblock %}
