name: manasety_parent
description: بوابة ولي الأمر — مدارس الشيخ صالح الشريف للتعليم القرآني
publish_to: 'none'
# Day 13 — release-polish sprint bumped to 0.3.0. Version string in the
# profile screen is now read at runtime from `package_info_plus` so this
# number is the single source of truth.
version: 0.4.1+6

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^14.2.0

  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0

  # Shared UI (theme, brand widgets, palette) — single source of truth for
  # both parent_app and teacher_app. Every visual change lands here.
  manasety_ui:
    path: ../manasety_ui

  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  intl: ^0.20.2
  collection: ^1.18.0

  # Day 13 — runtime version + build number for the profile screen.
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  # NOTE: `assets/images/logo-*.png` are no longer bundled at the app level —
  # runtime code now loads them from `package:manasety_ui`. The PNGs still live
  # on disk (see `flutter_launcher_icons` block below) because that tool reads
  # `image_path` directly at build time, outside Flutter's asset pipeline.
  #
  # Day 13 (v3) — splash-bg.png IS bundled: the WelcomeSplashScreen loads it
  # at runtime via Image.asset to render the full illuminated-manuscript
  # design that Android's native splash API can't paint on its own.
  assets:
    - assets/images/splash-bg.png

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: "assets/images/logo-emblem.png"
  min_sdk_android: 23
  # Day 13 — parent stays navy (primary brand); adaptive foreground is now
  # the safe-zone-baked emblem (628px inside 1024px canvas) so no petal is
  # ever clipped by circular/squircle/teardrop masks.
  adaptive_icon_background: "#001556"
  adaptive_icon_foreground: "assets/images/logo-emblem-adaptive.png"
  remove_alpha_ios: true

# Day 1 — branded cold-launch splash. Bridges the sub-second between OS launch
# and Flutter's first frame with the navy brand + centered vertical logo,
# eliminating the white default splash flash. Dark-mode colors declared now
# so Day 2 (dark theme) doesn't need to revisit this file.
flutter_native_splash:
  # Day 13 (v3) - reverted to minimal OS-level splash. The illuminated
  # manuscript design lives in a Flutter-side WelcomeSplashScreen instead,
  # because Android 12+ splash API (which our Xiaomi/MIUI 15 device uses)
  # only allows `color` + centered icon - `background_image` is silently
  # dropped. The Flutter welcome screen shows the full design for ~1400ms
  # after this OS splash dismisses, uniformly across all Android versions.
  color: "#001556"
  image: assets/images/splash-blank.png
  color_dark: "#0B1220"
  image_dark: assets/images/splash-blank.png
  android_12:
    color: "#001556"
    image: assets/images/splash-blank.png
    color_dark: "#0B1220"
    image_dark: assets/images/splash-blank.png
  web: false
