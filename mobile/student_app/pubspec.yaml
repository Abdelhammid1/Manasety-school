name: manasety_student
description: تطبيق الطالب — منصتي K-12 LMS
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0

  # Shared UI (theme + widgets shared across all three Manasety apps).
  manasety_ui:
    path: ../manasety_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
