name: manasety_teacher
description: تطبيق المعلم — منصتي K-12 LMS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^14.2.0

  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0+1
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1

  # Shared UI (theme, brand widgets, palette) — single source of truth for
  # both parent_app and teacher_app. Every visual change lands here.
  manasety_ui:
    path: ../manasety_ui

  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  intl: ^0.20.2
  collection: ^1.18.0

  # Day 13 — runtime version + build number for the profile screen.
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  # NOTE: `assets/images/logo-*.png` are no longer bundled at the app level —
  # runtime code now loads them from `package:manasety_ui`. The PNGs still live
  # on disk (see `flutter_launcher_icons` block below) because that tool reads
  # `image_path` directly at build time, outside Flutter's asset pipeline.
  #
  # Day 13 (v3) — splash-bg.png IS bundled: the WelcomeSplashScreen loads it
  # at runtime via Image.asset to render the full illuminated-manuscript
  # design that Android's native splash API can't paint on its own.
  assets:
    - assets/images/splash-bg.png
    - assets/brand/

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  # Session #6 — the real Manasety wordmark (منصتي / Manasety) from
  # `app/static/img/logo-lockup-vertical.png`, replacing the older
  # Sheikh Saleh Sharif floral emblem.
  image_path: "assets/images/manasety-launcher.png"
  min_sdk_android: 23
  # Teacher, parent, student apps share one visual family: navy square
  # background with the white wordmark centered inside the 66% safe zone.
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/images/manasety-launcher-adaptive-foreground.png"
  remove_alpha_ios: true

# Day 1 — branded cold-launch splash. Bridges the sub-second between OS launch
# and Flutter's first frame with the navy brand + centered vertical logo,
# eliminating the white default splash flash. Dark-mode colors declared now
# so Day 2 (dark theme) doesn't need to revisit this file.
flutter_native_splash:
  # Manasety navy for cold-launch. Flutter renders the full splash
  # (wordmark + progress bar) once the OS handoff completes.
  color: "#1E3A8A"
  image: assets/images/splash-blank.png
  color_dark: "#0B1220"
  image_dark: assets/images/splash-blank.png
  android_12:
    color: "#1E3A8A"
    image: assets/images/splash-blank.png
    color_dark: "#0B1220"
    image_dark: assets/images/splash-blank.png
  web: false
