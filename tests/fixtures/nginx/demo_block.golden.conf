# school: demo
server {
    listen 80;
    listen [::]:80;
    server_name demo.manasety.ai;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.manasety.ai;

    ssl_certificate     /etc/letsencrypt/live/wildcard-manasety/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard-manasety/privkey.pem;

    # file_storage.py accepts up to 10 MB; headroom for multipart overhead.
    client_max_body_size 12m;

    location / {
        proxy_pass http://172.21.0.1:5006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
# end school: demo
